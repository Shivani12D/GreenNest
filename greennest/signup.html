<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Signup - GreenNest</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="sidebar">
    <h2>GreenNest Menu</h2>
    <a class="navlink" href="index.html">Home</a>
    <a class="navlink" href="login.html">Login</a>
  </div>

  <div class="container">
    <div class="header">
      <div class="brand"><div class="logo">🌱</div><h1>GreenNest</h1></div>
      <div class="top-controls">
        <div class="search"><input id="search-input" placeholder="Search plants"></div>
        <button class="icon-btn" id="cart-icon">🛒<span class="cart-badge" id="cart-count">0</span></button>
        <button class="icon-btn" id="auth-btn">Login</button>
      </div>
    </div>

    <div class="card" style="max-width:520px;margin:0 auto">
      <h2>Signup</h2>
      <form id="signup-form" style="display:flex;flex-direction:column;gap:8px;margin-top:8px">
        <input name="email" placeholder="Gmail" required style="padding:8px;border-radius:8px;border:1px solid #ddd">
        <input name="username" placeholder="Username" required style="padding:8px;border-radius:8px;border:1px solid #ddd">
        <input name="password" type="password" placeholder="Password" required style="padding:8px;border-radius:8px;border:1px solid #ddd">
        <input name="mobile" placeholder="Mobile number" style="padding:8px;border-radius:8px;border:1px solid #ddd">
        <textarea name="address" placeholder="Address" style="padding:8px;border-radius:8px;border:1px solid #ddd"></textarea>
        <div style="display:flex;gap:8px;justify-content:flex-end">
          <button class="btn" type="submit">Create account</button>
        </div>
      </form>
    </div>

    <div class="footer">© GreenNest</div>
  </div>

  <script src="script.js"></script>
  <script> GreenNest.globalInit(); GreenNest.initSignupPage(); </script>
</body>
</html>
